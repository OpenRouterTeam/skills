name: LintLang

on:
  pull_request:
    paths:
      - "skills/**"
      - "open-responses/**"
      - ".github/workflows/lintlang.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lintlang:
    name: Lint SKILL.md files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LintLang
        run: pip install lintlang==0.8.1

      # --discover finds every SKILL.md under the repo root. The step fails only
      # on a FAIL verdict (any CRITICAL/HIGH finding); REVIEW and PASS exit 0.
      - name: Scan SKILL.md files
        run: lintlang scan --discover . --fail-on fail
