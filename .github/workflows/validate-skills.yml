name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_VERSION: 2.103.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned GitHub CLI
        run: |
          set -euo pipefail
          tarball="gh_${GH_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          curl -fsSL "$base/$tarball" -o "$RUNNER_TEMP/$tarball"
          curl -fsSL "$base/gh_${GH_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  ${tarball}$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      # Same parser and checks `gh skill install` uses, so invalid frontmatter YAML fails here instead of at install time.
      - name: gh skill publish --dry-run
        run: |
          gh --version
          gh skill publish --dry-run .
